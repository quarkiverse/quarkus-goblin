<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Goblin head - light mode (dark icon on light background) -->
  <circle cx="32" cy="34" r="24" fill="#6D28D9"/>
  <!-- Eyes -->
  <ellipse cx="24" cy="30" rx="4" ry="5" fill="#D97706"/>
  <ellipse cx="40" cy="30" rx="4" ry="5" fill="#D97706"/>
  <circle cx="25" cy="29" r="2" fill="#1E1E2E"/>
  <circle cx="41" cy="29" r="2" fill="#1E1E2E"/>
  <!-- Ears -->
  <polygon points="6,22 14,32 10,14" fill="#6D28D9" stroke="#D97706" stroke-width="1.5"/>
  <polygon points="58,22 50,32 54,14" fill="#6D28D9" stroke="#D97706" stroke-width="1.5"/>
  <!-- Mouth -->
  <path d="M22 42 Q32 50 42 42" stroke="#D97706" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Lightning bolt -->
  <polygon points="34,10 28,26 34,26 30,40 42,22 36,22 40,10" fill="#D97706"/>
