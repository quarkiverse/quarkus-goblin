<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Goblin head - dark mode (light icon on dark background) -->
  <circle cx="32" cy="34" r="24" fill="#7C3AED"/>
  <!-- Eyes -->
  <ellipse cx="24" cy="30" rx="4" ry="5" fill="#FBBF24"/>
  <ellipse cx="40" cy="30" rx="4" ry="5" fill="#FBBF24"/>
  <circle cx="25" cy="29" r="2" fill="#1E1E2E"/>
  <circle cx="41" cy="29" r="2" fill="#1E1E2E"/>
  <!-- Ears -->
  <polygon points="6,22 14,32 10,14" fill="#7C3AED" stroke="#FBBF24" stroke-width="1.5"/>
  <polygon points="58,22 50,32 54,14" fill="#7C3AED" stroke="#FBBF24" stroke-width="1.5"/>
  <!-- Mouth -->
  <path d="M22 42 Q32 50 42 42" stroke="#FBBF24" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Lightning bolt -->
