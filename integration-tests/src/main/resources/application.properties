quarkus.goblin.enabled=true
quarkus.goblin.assault.type=latency
quarkus.goblin.assault.latency.min-milliseconds=100
quarkus.goblin.assault.latency.max-milliseconds=500
quarkus.goblin.target.level=100
quarkus.micrometer.export.prometheus.step=PT1S
# The InMemoryTraceSpanExporter bean only exists in the test classpath, so the CDI exporter is test-scoped;
# the 250ms batch delay keeps the tracing assertions fast without relying on the 5s default flush.
%test.quarkus.otel.traces.exporter=cdi
%test.quarkus.otel.bsp.schedule.delay=250
quarkus.rest-client.sample-client.url=http://localhost:8081
# Quarkus 3.38 auto-enables the Observability LGTM dev service in dev mode whenever OTel is on the classpath with no
# explicit exporter configured. It requires Docker and mandatory config mapped properties (grafana.endpoint,
# otel-collector.url), which breaks `quarkus:dev` without a running Docker daemon. The integration-tests app has its
# own OpenTelemetry setup (cdi exporter), so this dev service is disabled.
quarkus.observability.enabled=false
# Surface Goblin assault traces (layer resolution, service injections, client/filter assaults) in `quarkus:dev` only.
%dev.quarkus.log.category."io.quarkiverse.goblin".level=DEBUG
%dev.quarkus.log.category."io.quarkiverse.goblin".min-level=DEBUG
# DATABASE layer demo: an in-memory H2 datasource (no Docker dev service needed).
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:goblin;DB_CLOSE_DELAY=-1
quarkus.datasource.devservices.enabled=false
# MESSAGING layer demo: consumers fed through the in-memory connector. The ignore strategy keeps a channel alive after a
# Goblin-injected failure (the default strategy would stop the channel on the first nack).
mp.messaging.incoming.orders.connector=smallrye-in-memory
mp.messaging.incoming.orders.failure-strategy=ignore
mp.messaging.incoming.audits.connector=smallrye-in-memory
mp.messaging.incoming.audits.failure-strategy=ignore
