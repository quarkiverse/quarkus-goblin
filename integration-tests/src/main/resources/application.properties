quarkus.goblin.enabled=true
quarkus.goblin.assault.type=latency
quarkus.goblin.assault.latency.min-milliseconds=100
quarkus.goblin.assault.latency.max-milliseconds=500
quarkus.goblin.target.level=100
quarkus.micrometer.export.prometheus.step=PT1S
# The InMemoryTraceSpanExporter bean only exists in the test classpath, so the CDI exporter is test-scoped;
# the 250ms batch delay keeps the tracing assertions fast without relying on the 5s default flush.
%test.quarkus.otel.traces.exporter=cdi
%test.quarkus.otel.bsp.schedule.delay=250
quarkus.rest-client.sample-client.url=http://localhost:8081
